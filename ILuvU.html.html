<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>For My Love ❤️</title>
  <style>
    body {
      background: pink;
      font-family: 'Comic Sans MS', cursive, sans-serif;
      text-align: center;
      padding-top: 100px;
    }
    h1 {
      color: red;
      font-size: 3em;
      animation: heartbeat 1s infinite;
    }
    @keyframes heartbeat {
      0% { transform: scale(1); }
      25% { transform: scale(1.2); }
      50% { transform: scale(1); }
      75% { transform: scale(1.2); }
      100% { transform: scale(1); }
    }
    p {
      font-size: 1.5em;
      color: #660033;
    }
  </style>
</head>
<body>
  <h1>💖 Hey cutie 💖</h1>
  <p>I have a secret...</p>
  <p>I’m crazy about you 😘</p>
  <p><strong>I love you!</strong></p>
</body>
</html>

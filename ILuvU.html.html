<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <title>给雯萱的秘密 ❤️</title>
  <style>
    body {
      background: linear-gradient(135deg, #ff99cc, #ffe6f0);
      font-family: 'Microsoft YaHei', sans-serif;
      text-align: center;
      padding-top: 80px;
      overflow: hidden;
    }
    h1 { color:#ff3366; font-size:2.5em; }
    button {
      background:#ff6699; border:none; padding:15px 30px;
      font-size:1.2em; color:white; border-radius:10px;
      cursor:pointer; margin-top:20px;
    }
    button:hover { background:#ff3366; transform:scale(1.1); }
    #progress-container {
      width:300px; height:30px; border:2px solid #ff3366;
      border-radius:20px; margin:20px auto; background:#fff;
      overflow:hidden; position:relative;
    }
    #progress-bar {
      height:100%; width:0%; background:#ff3366;
      transition:width 0.2s;
    }
    #progress-text {
      position:relative; margin-top:-45px;
      font-weight:bold; color:#660033;
      font-size:16px; text-shadow:1px 1px 2px #fff;
    }
    #secret { margin-top:30px; font-size:1.8em; color:#660033; opacity:0; transition:opacity 2s; }
    #secret.show { opacity:1; }
    #quiz { margin-top:20px; font-size:1.2em; display:none; }
    #quiz button { margin:5px; padding:8px 15px; font-size:1em; border-radius:8px; border:none; background:#ff99cc; cursor:pointer; }
    #quiz button:hover { background:#ff3366; color:white; }
    #remark { margin-top:15px; font-size:1.2em; color:#cc0033; display:none; }

    /* Firework styles */
    .firework {
      position: absolute;
      font-size: 40px;
      opacity: 0;
      animation: shoot 1s ease-out forwards;
    }
    @keyframes shoot {
      0% { opacity:1; transform:translateY(100vh) scale(0.5); }
      100% { opacity:1; transform:translateY(50vh) scale(1); }
    }
    .burst {
      position: absolute;
      font-size: 20px;
      opacity: 0;
      animation: burst 2s ease-out forwards;
    }
    @keyframes burst {
      0% { opacity:1; transform:scale(0.5); }
      100% { opacity:0; transform:scale(2) translateY(-100px); }
    }
    .firework-message {
      position: absolute;
      font-size: 22px;
      color: #ff3366;
      text-shadow: 1px 1px 3px #fff;
      opacity: 0;
      animation: msgFade 3s ease-out forwards;
    }
    @keyframes msgFade {
      0% { opacity:0; }
      30% { opacity:1; }
      100% { opacity:0; }
    }

    /* Bottom dispenser hearts */
    .dispenser-heart {
      position: absolute;
      font-size: 25px;
      color: #ff3366;
      bottom: 0;
      animation: rise 4s ease-out forwards;
    }
    @keyframes rise {
      0% { transform:translateY(0); opacity:1; }
      100% { transform:translateY(-500px); opacity:0; }
    }
  </style>
</head>
<body>
  <h1>嘿，雯萱 💕</h1>
  <p>想知道我的秘密吗？</p>
  
  <button onclick="fillHeart()">不停按我 💘</button>
  
  <div id="progress-container">
    <div id="progress-bar"></div>
  </div>
  <div id="progress-text">0%</div>
  
  <div id="quiz"></div>
  <div id="remark"></div>
  
  <div id="secret">
    <p><strong>雯萱姐姐，我爱你 ❤️</strong></p>
  </div>
  
<script>
let progress=0, quizStage=0, fireworkInterval, dispenserInterval;

function fillHeart(){
  if(document.getElementById("quiz").style.display==="block") return;
  progress=Math.min(progress+5,100);
  updateBar();

  if(progress>=25 && quizStage===0){
    showQuiz("我的生日是哪一天？","B",["A. 8月20日","B. 9月10日","C. 10月1日","D. 12月25日"],"哎呀，雯萱忘记我的生日啦！");
    quizStage=1;
  } else if(progress>=75 && quizStage===1){
    showQuiz("我的车是什么颜色？","C",["A. 红色","B. 蓝色","C. 紫色","D. 黑色"],"雯萱忘记我的车颜色啦！");
    quizStage=2;
  }

  if(progress>=100){
    document.getElementById('secret').classList.add('show');
    startFireworks();
    startDispenser();
  }
}

function updateBar(){
  document.getElementById('progress-bar').style.width=progress+"%";
  let text=document.getElementById('progress-text');
  text.innerHTML=progress+"%";
  text.style.fontSize=(16+progress/10)+"px";
}

function showQuiz(question,correct,options,remarkText){
  let quizDiv=document.getElementById("quiz");
  quizDiv.style.display="block";
  quizDiv.innerHTML="<p>"+question+"</p>";
  options.forEach((opt,index)=>{
    let btn=document.createElement("button");
    btn.innerHTML=opt;
    btn.onclick=()=>checkAnswer(String.fromCharCode(65+index),correct,remarkText);
    quizDiv.appendChild(btn);
  });
}

function checkAnswer(choice,correct,remarkText){
  if(choice===correct){
    document.getElementById("quiz").style.display="none";
  } else {
    document.body.classList.add("screen-vibrate");
    setTimeout(()=>document.body.classList.remove("screen-vibrate"),500);
    let remark=document.getElementById("remark");
    remark.style.display="block";
    remark.innerHTML=remarkText;
    progress=0;
    updateBar();
    document.getElementById("quiz").style.display="none";
    quizStage=0;
  }
}

/* Firework effect */
function startFireworks(){
  fireworkInterval=setInterval(()=>{
    launchFirework("left","雯萱好可爱！");
    setTimeout(()=>launchFirework("right","我好爱你！"),1500);
  },4000);
}

function launchFirework(side,message){
  let fw=document.createElement("div");
  fw.className="firework";
  fw.innerHTML="❤️";
  fw.style.left=(side==="left"?"10%":"90%");
  document.body.appendChild(fw);

  setTimeout(()=>{
    fw.remove();
    for(let i=0;i<10;i++){
      let burst=document.createElement("div");
      burst.className="burst";
      burst.innerHTML="💖";
      burst.style.left=(side==="left"?"20%":"80%");
      burst.style.top="50vh";
      document.body.appendChild(burst);
      setTimeout(()=>burst.remove(),2000);
    }
    let msg=document.createElement("div");
    msg.className="firework-message";
    msg.innerHTML=message;
    msg.style.left=(side==="left"?"25%":"65%");
    msg.style.top="40vh";
    document.body.appendChild(msg);
    setTimeout(()=>msg.remove(),3000);
  },1000);
}

/* Bottom dispenser */
function startDispenser(){
  dispenserInterval=setInterval(()=>{
    let heart=document.createElement("div");
    heart.className="dispenser-heart";
    heart.innerHTML="❤️";
    heart.style.left=Math.random()*window.innerWidth+"px";
    document.body.appendChild(heart);
    setTimeout(()=>heart.remove(),4000);
  },300);
}
</script>
</body>
</html>
